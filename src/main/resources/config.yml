# CatPets Configuration
# Generated automatically on first run

# General settings
general:
  # Enable debug messages in console
  debug: false
  # Distance cat follows player
  follow-distance: 3.0
  # Cat teleport distance to player
  teleport-distance: 20.0
  # Cat name format (supports {player}, {cat}, {tier})
  name-format: "&6{cat} &7(&bTier {tier}&7)"
  # Show cat name always
  always-show-name: true

