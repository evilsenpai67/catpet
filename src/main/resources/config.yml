# Items configuration
items:
  upgrade-fish:
    material: "COOKED_COD"
    custom-model-data: 2001
    name: "&b&lUpgrade Fish &7(&e{cat}&7)"
    lore:
      - "&7Feed to your cat to upgrade to Tier 2"
      - "&7Cat Type: &e{cat}"
      - ""
      - "&eRight-click your cat to feed"
  tier3-core:
    material: "NETHER_STAR"
    custom-model-data: 2002
    name: "&d&lTier 3 Upgrade Core &7(&e{cat}&7)"
    lore:
      - "&7Use on your cat to unlock Tier 3 abilities"
      - "&7Cat Type: &e{cat}"
      - ""
      - "&eObtained from completing the ritual"
      - "&eRight-click your cat to apply"
  ritual-catalyst:
    material: "BEACON"
    custom-model-data: 2003
    name: "&6&lRitual Catalyst"
    lore:
      - "&7Place to start Tier 3 ritual"
      - "&7Duration: 1 hour"

# Ritual configuration
ritual:
  duration-ticks: 72000  # 1 hour = 72000 ticks (20 ticks/sec * 3600 sec)
  # Particle effects during ritual
  particles:
    - "ENCHANTMENT_TABLE"
    - "END_ROD"
    - "DRAGON_BREATH"
    - "SOUL_FIRE_FLAME"
  # Particle interval in ticks
  particle-interval: 20
  # Sound effects
  sounds:
    start: "ENTITY_ENDER_DRAGON_GROWL"
    loop: "BLOCK_BEACON_POWER_SELECT"
    complete: "ENTITY_PLAYER_LEVELUP"
    fail: "ENTITY_ENDER_DRAGON_DEATH"
  # Task bar settings
  taskbar:
    enabled: true
    title: "&6&lTier 3 Ritual in Progress"
    # Colors: GREEN, YELLOW, RED
  # Requirements
  requirements:
    # Blocks that must be around catalyst (optional)
    structure:
      enabled: false
      radius: 5
      required-blocks:
        - "OBSIDIAN"
        - "CRYING_OBSIDIAN"
    # Player must stay near catalyst
    player-range: 20
    # Cancel if player leaves
    cancel-on-leave: true
    # Cancel on damage
    cancel-on-damage: true

# Trust system
trust:
  # Max trusted players per cat
  max-trusted: 10
  # Trust lasts until removed
  persistent: true

